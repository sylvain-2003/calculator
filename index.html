<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice</title>
    <link rel="stylesheet" href="CSS/style.css">
    
</head>
<body>
    <div class="grid">
        <h1>
            Calculatrice
        </h1>
        <table>
            <tbody>
                <tr>
                    <td class="calculator-screen" colspan="3" >

                    </td>
                </tr>
                <tr>
                    <td>
                        <button>
                            1
                        </button>
                    </td>
                    <td>
                        <button>
                            2
                        </button>
                    </td>
                    <td>
                        <button>
                            3
                        </button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button>
                            4
                        </button>
                    </td>
                    <td>
                        <button>
                            5
                        </button>
                    </td>
                    <td>
                        <button>
                            6
                        </button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button>
                            7
                        </button>
                    </td>
                    <td>
                        <button>
                            8
                        </button>
                    </td>
                    <td>
                        <button>
                            9
                        </button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button>
                            +
                        </button>
                    </td>
                    <td>
                        <button>
                            0
                        </button>
                    </td>
                    <td>
                        <button>
                            -
                        </button>
                    </td>
                </tr>
                <tr>
                    <td colspan="3">
                        <button class="equal-button">
                            =
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
<script src="JS/script.js"></script>
</body>
</html>
